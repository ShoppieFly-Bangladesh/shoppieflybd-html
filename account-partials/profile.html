<section id="profile" class="sf-account-panel" aria-labelledby="sfHeading-profile" hidden>
    <div class="sf-panel-heading">
        <h2 id="sfHeading-profile">Profile</h2>

    </div>
<div class="sf-panel-settings">
        <article class="sf-panel-surface"><h3>Personal information</h3>
            <div class="sf-panel-avatar-row">
                <img width="48" height="48" id="sfProfileAvatarPreview" src="assets/img/user/1.webp" alt="Profile photo">
                <input type="file" id="sfProfileAvatarInput" class="d-none" accept="image/png,image/jpeg,image/webp">
                <label for="sfProfileAvatarInput" class="sf-panel-button sf-panel-outline"><i class="ri-camera-line" aria-hidden="true"></i> Change photo</label>
            </div>
            <form id="sfPersonalInfoForm" novalidate>
                        <div class="sf-panel-form-row">
                            <label for="sf_full_name" class="form-label small fw-semibold text-dark mb-1">Full Name</label>
                            <input
                                type="text"
                                class="form-control form-control-sm rounded-2"
                                id="sf_full_name"
                                name="full_name"
                                value="Ariful Islam"
                                required />
                        </div>

                        <div class="sf-panel-form-row">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="sf_phone_number" class="form-label small fw-semibold text-dark mb-0">Phone Number</label>
                                <a
                                    href="javascript:void(0)"
                                    class="text-primary small fw-semibold text-decoration-none"
                                    data-bs-toggle="modal"
                                    data-bs-target="#sfChangePhoneModal">
                                    Change Phone
                                </a>
                            </div>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light text-muted border-end-0">+880</span>
                                <input
                                    type="tel"
                                    class="form-control border-start-0 border-end-0 bg-light"
                                    id="sf_phone_number"
                                    value="1712-345678"
                                    readonly />
                                <span class="input-group-text bg-light border-start-0 pe-2">
                                    <span class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-2 py-0.5 fs-xs fw-semibold">
                                        Verified ✓
                                    </span>
                                </span>
                            </div>
                        </div>

                        <div class="sf-panel-form-row">
                            <label for="sf_email_address" class="form-label small fw-semibold text-dark mb-1">Email Address</label>
                            <input
                                type="email"
                                class="form-control form-control-sm rounded-2"
                                id="sf_email_address"
                                name="email"
                                value="ariful.islam@example.com"
                                required />
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label small fw-semibold text-dark mb-1 d-block">Gender</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="sf_gender" id="gender_male" value="Male" checked>
                                    <label class="btn btn-outline-secondary btn-sm py-1" for="gender_male">Male</label>

                                    <input type="radio" class="btn-check" name="sf_gender" id="gender_female" value="Female">
                                    <label class="btn btn-outline-secondary btn-sm py-1" for="gender_female">Female</label>

                                    <input type="radio" class="btn-check" name="sf_gender" id="gender_other" value="Other">
                                    <label class="btn btn-outline-secondary btn-sm py-1" for="gender_other">Other</label>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="sf_dob" class="form-label small fw-semibold text-dark mb-1">Date of Birth</label>
                                <input
                                    type="date"
                                    class="form-control form-control-sm rounded-2"
                                    id="sf_dob"
                                    name="dob"
                                    value="1995-08-15" />
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-sm px-4 py-2 fw-semibold rounded-2 shadow-sm d-inline-flex align-items-center gap-2"
                            id="sfSaveProfileBtn">
                            <span class="spinner-border spinner-border-sm d-none" id="sfSaveProfileSpinner" role="status" aria-hidden="true"></span>
                            <span id="sfSaveProfileText">Save Changes</span>
                        </button>
                    </form>
        </article>
        <article class="sf-panel-surface"><h3>Password</h3>
            <form id="sfPasswordForm" novalidate>
                        <div class="sf-panel-form-row">
                            <label for="sf_current_password" class="form-label small fw-semibold text-dark mb-1">Current Password</label>
                            <div class="position-relative">
                                <input
                                    type="password"
                                    class="form-control form-control-sm rounded-2 pe-5 sf-pwd-field"
                                    id="sf_current_password"
                                    name="current_password"
                                    placeholder="Enter current password"
                                    autocomplete="current-password"
                                    required />
                                <button
                                    type="button"
                                    class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y pe-2 py-0 border-0 sf-toggle-pwd-btn"
                                    data-target="sf_current_password"
                                    aria-label="Toggle password visibility">
                                    <i class="ri-eye-line"></i>
                                </button>
                            </div>
                        </div>

                        <div class="sf-panel-form-row">
                            <label for="sf_new_password" class="form-label small fw-semibold text-dark mb-1">New Password</label>
                            <div class="position-relative">
                                <input
                                    type="password"
                                    class="form-control form-control-sm rounded-2 pe-5 sf-pwd-field"
                                    id="sf_new_password"
                                    name="new_password"
                                    placeholder="Min. 8 characters"
                                    autocomplete="new-password"
                                    required />
                                <button
                                    type="button"
                                    class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y pe-2 py-0 border-0 sf-toggle-pwd-btn"
                                    data-target="sf_new_password"
                                    aria-label="Toggle password visibility">
                                    <i class="ri-eye-line"></i>
                                </button>
                            </div>
                        </div>

                        <div class="sf-panel-form-row">
                            <label for="sf_confirm_password" class="form-label small fw-semibold text-dark mb-1">Confirm Password</label>
                            <div class="position-relative">
                                <input
                                    type="password"
                                    class="form-control form-control-sm rounded-2 pe-5 sf-pwd-field"
                                    id="sf_confirm_password"
                                    name="confirm_password"
                                    placeholder="Re-enter new password"
                                    autocomplete="new-password"
                                    required />
                                <button
                                    type="button"
                                    class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y pe-2 py-0 border-0 sf-toggle-pwd-btn"
                                    data-target="sf_confirm_password"
                                    aria-label="Toggle password visibility">
                                    <i class="ri-eye-line"></i>
                                </button>
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark btn-sm px-4 py-2 fw-semibold rounded-2 shadow-sm d-inline-flex align-items-center gap-2"
                            id="sfUpdatePwdBtn">
                            <span class="spinner-border spinner-border-sm d-none" id="sfUpdatePwdSpinner" role="status" aria-hidden="true"></span>
                            <span id="sfUpdatePwdText">Update Password</span>
                        </button>
                    </form>
        </article>
    </div>
</section>

<div class="modal fade" id="sfChangePhoneModal" tabindex="-1" aria-labelledby="sfChangePhoneModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow rounded-3">
                    <div class="modal-header border-bottom pb-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="p-2 bg-primary-subtle text-primary rounded-circle">
                                <i class="ri-phone-fill fs-5"></i>
                            </span>
                            <div>
                                <h5 class="modal-title fw-bold text-dark fs-6" id="sfChangePhoneModalLabel">Change Phone Number</h5>
                                <p class="text-muted small mb-0">Verify via 6-digit OTP</p>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body p-4">
                        <div id="sfChangePhoneStep1">
                            <div class="mb-3">
                                <label for="sfNewPhoneInput" class="form-label small fw-semibold text-dark">
                                    New Mobile Number (BD) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0 fw-semibold">+880</span>
                                    <input
                                        type="tel"
                                        class="form-control border-start-0"
                                        id="sfNewPhoneInput"
                                        placeholder="1XXXXXXXXX"
                                        maxlength="10" />
                                </div>
                            </div>
                            <button
                                type="button"
                                class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center gap-2"
                                id="sfSendPhoneOtpBtn">
                                <span class="spinner-border spinner-border-sm d-none" id="sfSendOtpSpinner"></span>
                                <i class="ri-send-plane-fill"></i>
                                <span>Send Verification Code</span>
                            </button>
                        </div>

                        <div id="sfChangePhoneStep2" class="d-none text-center">
                            <div class="p-3 bg-light rounded-3 mb-3">
                                <h6 class="fw-bold mb-1">Enter 6-digit Code</h6>
                                <p class="text-muted small mb-0">Sent to <strong id="sfDisplayTargetNewPhone">+880 1XXXXXXXXX</strong></p>
                            </div>
                            <div class="d-flex justify-content-center gap-2 mb-3">
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;" autofocus>
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;">
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;">
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;">
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;">
                                <input type="text" maxlength="1" class="form-control text-center fw-bold fs-5 sf-otp-digit" style="width: 44px; height: 48px;">
                            </div>
                            <div class="d-flex justify-content-between align-items-center small mb-3">
                                <a href="javascript:void(0)" class="text-muted text-decoration-none" id="sfBackToPhoneStep">← Back</a>
                                <span class="text-muted">Resend OTP in <strong>0:45</strong></span>
                            </div>
                            <button
                                type="button"
                                class="btn btn-success w-100 py-2 fw-semibold rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center gap-2"
                                id="sfConfirmPhoneOtpBtn">
                                <i class="ri-checkbox-circle-line"></i>
                                <span>Verify & Update Phone</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Embedded Interactive Script for Profile Self-Sufficiency -->
        <script>
            (function () {
                function initProfilePartial() {
                    // 1. Instant Avatar Preview
                    const avatarInput = document.getElementById('sfProfileAvatarInput');
                    const avatarPreview = document.getElementById('sfProfileAvatarPreview');
                    if (avatarInput && avatarPreview) {
                        avatarInput.addEventListener('change', function (e) {
                            const file = e.target.files && e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = function (evt) {
                                    avatarPreview.src = evt.target.result;
                                    const sidebarAvatars = document.querySelectorAll('.sf-account-sidebar-avatar, .sf-user-avatar-sync');
                                    sidebarAvatars.forEach(img => { img.src = evt.target.result; });
                                };
                                reader.readAsDataURL(file);
                            }
                        });
                    }

                    // 2. Toggle Password Visibility for .sf-toggle-pwd-btn
                    const pwdToggleButtons = document.querySelectorAll('.sf-toggle-pwd-btn');
                    pwdToggleButtons.forEach(btn => {
                        btn.addEventListener('click', function () {
                            const targetId = this.getAttribute('data-target');
                            const input = targetId ? document.getElementById(targetId) : this.closest('.position-relative').querySelector('input');
                            if (input) {
                                const isPassword = input.type === 'password';
                                input.type = isPassword ? 'text' : 'password';
                                const icon = this.querySelector('i');
                                if (icon) {
                                    if (isPassword) {
                                        icon.classList.remove('ri-eye-line');
                                        icon.classList.add('ri-eye-off-line');
                                    } else {
                                        icon.classList.remove('ri-eye-off-line');
                                        icon.classList.add('ri-eye-line');
                                    }
                                }
                            }
                        });
                    });

                    // 3. Save Personal Info Form with Spinner State
                    const profileForm = document.getElementById('sfPersonalInfoForm');
                    const saveProfileBtn = document.getElementById('sfSaveProfileBtn');
                    const saveSpinner = document.getElementById('sfSaveProfileSpinner');
                    const saveText = document.getElementById('sfSaveProfileText');
                    if (profileForm && saveProfileBtn) {
                        profileForm.addEventListener('submit', function (e) {
                            e.preventDefault();
                            const fullNameVal = (document.getElementById('sf_full_name').value || '').trim();
                            if (!fullNameVal) {
                                alert('Please provide your full name.');
                                return;
                            }

                            saveProfileBtn.disabled = true;
                            if (saveSpinner) saveSpinner.classList.remove('d-none');
                            if (saveText) saveText.textContent = 'Saving...';

                            setTimeout(() => {
                                saveProfileBtn.disabled = false;
                                if (saveSpinner) saveSpinner.classList.add('d-none');
                                if (saveText) saveText.textContent = 'Save Changes';

                                if (window.iziToast) {
                                    window.iziToast.success({
                                        title: 'Success',
                                        message: 'Personal details updated successfully!',
                                        position: 'topRight'
                                    });
                                } else {
                                    alert('Personal details updated successfully!');
                                }
                            }, 800);
                        });
                    }

                    // 4. Update Password Form with Validation & Spinner State
                    const pwdForm = document.getElementById('sfPasswordForm');
                    const updatePwdBtn = document.getElementById('sfUpdatePwdBtn');
                    const updatePwdSpinner = document.getElementById('sfUpdatePwdSpinner');
                    const updatePwdText = document.getElementById('sfUpdatePwdText');
                    if (pwdForm && updatePwdBtn) {
                        pwdForm.addEventListener('submit', function (e) {
                            e.preventDefault();
                            const curr = document.getElementById('sf_current_password').value;
                            const newP = document.getElementById('sf_new_password').value;
                            const conf = document.getElementById('sf_confirm_password').value;

                            if (!curr) {
                                alert('Please enter your current password.');
                                return;
                            }
                            if (!newP || newP.length < 6) {
                                alert('New password must be at least 6 characters.');
                                return;
                            }
                            if (newP !== conf) {
                                alert('New password and confirm password do not match.');
                                return;
                            }

                            updatePwdBtn.disabled = true;
                            if (updatePwdSpinner) updatePwdSpinner.classList.remove('d-none');
                            if (updatePwdText) updatePwdText.textContent = 'Updating...';

                            setTimeout(() => {
                                updatePwdBtn.disabled = false;
                                if (updatePwdSpinner) updatePwdSpinner.classList.add('d-none');
                                if (updatePwdText) updatePwdText.textContent = 'Update Password';

                                pwdForm.reset();

                                if (window.iziToast) {
                                    window.iziToast.success({
                                        title: 'Security',
                                        message: 'Password updated successfully!',
                                        position: 'topRight'
                                    });
                                } else {
                                    alert('Password updated successfully!');
                                }
                            }, 800);
                        });
                    }

                    // 5. 2FA Toggle Switch State
                    const twoFaToggle = document.getElementById('sf2FaToggle');
                    const twoFaBadge = document.getElementById('sf2FaStatusBadge');
                    if (twoFaToggle && twoFaBadge) {
                        twoFaToggle.addEventListener('change', function () {
                            if (this.checked) {
                                twoFaBadge.textContent = 'Active';
                                twoFaBadge.className = 'badge rounded-pill bg-success-subtle text-success border border-success-subtle fs-xs fw-semibold';
                            } else {
                                twoFaBadge.textContent = 'Disabled';
                                twoFaBadge.className = 'badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle fs-xs fw-semibold';
                            }
                        });
                    }

                    // 6. Change Phone Modal Handler
                    const sendOtpBtn = document.getElementById('sfSendPhoneOtpBtn');
                    const step1 = document.getElementById('sfChangePhoneStep1');
                    const step2 = document.getElementById('sfChangePhoneStep2');
                    const targetDisplay = document.getElementById('sfDisplayTargetNewPhone');
                    const backBtn = document.getElementById('sfBackToPhoneStep');
                    const confirmOtpBtn = document.getElementById('sfConfirmPhoneOtpBtn');
                    const phoneInput = document.getElementById('sfNewPhoneInput');

                    if (sendOtpBtn && step1 && step2) {
                        sendOtpBtn.addEventListener('click', function () {
                            const val = (phoneInput.value || '').trim();
                            if (val.length < 9) {
                                alert('Please enter a valid mobile number.');
                                return;
                            }
                            this.disabled = true;
                            const spinner = document.getElementById('sfSendOtpSpinner');
                            if (spinner) spinner.classList.remove('d-none');

                            setTimeout(() => {
                                this.disabled = false;
                                if (spinner) spinner.classList.add('d-none');
                                step1.classList.add('d-none');
                                step2.classList.remove('d-none');
                                if (targetDisplay) targetDisplay.textContent = '+880 ' + val;
                            }, 600);
                        });
                    }

                    if (backBtn && step1 && step2) {
                        backBtn.addEventListener('click', function () {
                            step2.classList.add('d-none');
                            step1.classList.remove('d-none');
                        });
                    }

                    if (confirmOtpBtn) {
                        confirmOtpBtn.addEventListener('click', function () {
                            const newNumberFormatted = (phoneInput.value || '1712-345678');
                            const phoneField = document.getElementById('sf_phone_number');
                            if (phoneField) phoneField.value = newNumberFormatted;

                            const modalEl = document.getElementById('sfChangePhoneModal');
                            if (modalEl && window.bootstrap && window.bootstrap.Modal) {
                                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                                if (modalInstance) modalInstance.hide();
                            }

                            step2.classList.add('d-none');
                            step1.classList.remove('d-none');
                            if (phoneInput) phoneInput.value = '';

                            if (window.iziToast) {
                                window.iziToast.success({
                                    title: 'Phone Verified',
                                    message: 'Phone number updated successfully!',
                                    position: 'topRight'
                                });
                            } else {
                                alert('Phone number updated successfully!');
                            }
                        });
                    }

                    // OTP digit auto-focus advance
                    const otpDigits = document.querySelectorAll('.sf-otp-digit');
                    otpDigits.forEach((digit, idx) => {
                        digit.addEventListener('input', function () {
                            if (this.value.length === 1 && idx < otpDigits.length - 1) {
                                otpDigits[idx + 1].focus();
                            }
                        });
                        digit.addEventListener('keydown', function (e) {
                            if (e.key === 'Backspace' && !this.value && idx > 0) {
                                otpDigits[idx - 1].focus();
                            }
                        });
                    });
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initProfilePartial);
                } else {
                    initProfilePartial();
                }
            })();
        </script>
